<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professores</title>
</head>
<body>
    <div>
        <h1>Cadastro de Professores | UNI7 - Semestre 2026.2</h1>

        <div>
             <h2>1 - Informações Pessoais</h2>
            <form>
                <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>
                
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>
                
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>

                <label for="sexo">Sexo:</label>
                <input type="radio" id="masculino" name="sexo" value="masculino" required>
                <label for="masculino">Masculino</label>

                <input type="radio" id="feminino" name="sexo" value="feminino" required>
                <label for="feminino">Feminino</label>

                <input type="radio" id="outro" name="sexo" value="outro" required>
                <label for="outro">Outro</label>

                <br><br>
                <label for="email">Email institucional:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>
                <br><br>

                <label for="endereco">Endereço completo:</label>
                <input type="text" id="endereco" name="endereco" required placeholder="CEP">

                <label for="rua">Rua:</label>
                <input type="text" id="rua" name="rua" required>

                <label for="numero">Número:</label>
                <input type="number" id="numero" name="numero" required>

                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="bairro" required>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>

                <br><br>
                <h2>Vínculo institucional</h2>

                <label for="departamento">Departamento:</label>
                <select id="departamento" name="departamento" required>
                    <option value="">Selecione um departamento</option>
                    <option value="computacao">Computação</option>
                    <option value="engenharia">Engenharia</option>
                    <option value="matematica">Matemática</option>
                </select>

                <label for="cargaHoraria">Carga Horária:</label>
                <input type="number" id="cargaHoraria" name="cargaHoraria" required>

                <label for="vinculo">Vínculo institucional:</label>
                <select id="vinculo" name="vinculo" required>
                    <option value="">Selecione um vínculo</option>
                    <option value="professor">Professor</option>
                    <option value="pesquisador">Pesquisador</option>
                </select>

                <br><br>
                <label for="atuacao">Área de Atuação:</label>
                <input type="text" id="atuacao" name="atuacao" required>

                <label for="disciplina">Disciplina:</label>
                <input type="text" id="disciplina" name="disciplina" required>
                
                <br><br>
                <input type="submit" value="Cadastrar">
            </form>
        </div>
    </div>
</body>
</html>
